[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-toss"
version = "0.1.0"
description = "Probabilistic stock forecasting, purged time-series validation, and official Toss market data"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["torch==2.8.0", "numpy>=1.24,<3"]

[project.scripts]
quant-toss = "quant_toss.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
