name: Forecast and paper-backtest checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m quant_toss.demo --output artifacts/ci
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-paper-research-only
          path: |
            artifacts/ci/linear/report.json
            artifacts/ci/transformer/report.json
            artifacts/ci/forecast.json
